<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Support and privacy information for Praylist. Available in English and Korean.">
<meta name="theme-color" content="#f8f6ef">
<title>Praylist · Support &amp; Privacy</title>
<style>
:root { color-scheme: light; --paper: #f8f6ef; --ink: #253d32; --muted: #526258; --line: #d7ded5; --accent: #2d6952; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; font-size: 17px; line-height: 1.8; overflow-wrap: anywhere; }
a { color: var(--accent); text-underline-offset: 4px; }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 3px; }
.shell { max-width: 820px; margin: 0 auto; padding: 0 30px; }
header { padding: 36px 0 26px; border-bottom: 1px solid var(--line); }
.brand { font-family: Georgia, serif; font-size: 32px; line-height: 1; letter-spacing: -1px; }
main { padding: 64px 0 60px; }
h1 { margin: 0 0 18px; font-size: clamp(32px, 6vw, 46px); line-height: 1.28; letter-spacing: -1.5px; font-weight: 650; }
.intro { max-width: 580px; margin: 0 0 36px; color: var(--muted); }
.languages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
section { padding: 25px; border: 1px solid var(--line); border-radius: 20px; }
h2 { margin: 0 0 12px; font-size: 22px; font-weight: 650; }
section a { display: block; min-height: 44px; padding: 8px 0; }
footer { border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--muted); font-size: 14px; }
footer p { margin: 8px 0 0; }
@media (max-width: 560px) { .shell { padding: 0 22px; } main { padding-top: 44px; } .languages { grid-template-columns: 1fr; gap: 16px; } }
@media print { body { background: white; } main { padding-top: 30px; } a { color: inherit; } }
</style>
</head>
<body>
<div class="shell">
<header><span class="brand">praylist</span></header>
<main>
<h1>Your prays, in one place.</h1>
<p class="intro">Support and privacy information for Praylist. Choose a language to continue.</p>
<nav class="languages" aria-label="Support and privacy by language">
<section aria-labelledby="english-title">
<h2 id="english-title">English</h2>
<a href="support-en.html" hreflang="en">Support</a>
<a href="privacy-en.html" hreflang="en">Privacy Policy</a>
</section>
<section lang="ko" aria-labelledby="korean-title">
<h2 id="korean-title">한국어</h2>
<a href="support.html" hreflang="ko">사용 안내</a>
<a href="privacy.html" hreflang="ko">개인정보 처리방침</a>
</section>
</nav>
</main>
<footer>
<p><a href="mailto:visionexperiencedeveloper@gmail.com">visionexperiencedeveloper@gmail.com</a></p>
<p>© 2026 VXDeveloper</p>
</footer>
</div>
</body>
</html>
