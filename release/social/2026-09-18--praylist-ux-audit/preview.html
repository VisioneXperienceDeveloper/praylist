<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praylist UX Audit — Instagram Feed Preview</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    body { margin: 0; background: #d8d5cd; color: #253d32; }
    main { max-width: 1480px; margin: 0 auto; padding: 44px 28px 70px; }
    h1 { margin: 0 0 10px; font-size: 34px; }
    p { margin: 0 0 32px; color: #59645c; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px; }
    figure { margin: 0; }
    img { display: block; width: 100%; border-radius: 10px; box-shadow: 0 12px 30px rgba(24, 42, 32, .14); }
    figcaption { padding: 10px 2px 0; font-size: 14px; color: #59645c; }
  </style>
</head>
<body>
  <main>
    <h1>Praylist UX Audit</h1>
    <p>Instagram 4:5 carousel · 검수용 · 업로드 전</p>
    <section class="grid">
      <figure><img src="feed/01-cover.png" alt="1장 표지"><figcaption>01 — Cover</figcaption></figure>
      <figure><img src="feed/02-verdict.png" alt="2장 총평"><figcaption>02 — Verdict</figcaption></figure>
      <figure><img src="feed/03-good-direct-entry.png" alt="3장 직접 입력"><figcaption>03 — Good: direct entry</figcaption></figure>
      <figure><img src="feed/04-good-focus.png" alt="4장 기도 집중"><figcaption>04 — Good: focus</figcaption></figure>
      <figure><img src="feed/05-good-meaningful-history.png" alt="5장 의미 있는 기록"><figcaption>05 — Good: meaningful history</figcaption></figure>
      <figure><img src="feed/06-bad-localization.png" alt="6장 언어 불일치"><figcaption>06 — Bad: localization</figcaption></figure>
      <figure><img src="feed/07-bad-navigation.png" alt="7장 탐색 구조"><figcaption>07 — Bad: navigation</figcaption></figure>
      <figure><img src="feed/08-bad-save-confidence.png" alt="8장 저장 확신"><figcaption>08 — Bad: save confidence</figcaption></figure>
      <figure><img src="feed/09-fix-order.png" alt="9장 개선 순서"><figcaption>09 — Fix order</figcaption></figure>
      <figure><img src="feed/10-closing.png" alt="10장 마무리"><figcaption>10 — Closing</figcaption></figure>
    </section>
  </main>
</body>
</html>
